<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ensayos</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0e0e10;--bg2:#16161a;--bg3:#1e1e24;--bg4:#252530;--surface:#2a2a35;--surface2:#32323f;
  --text:#ffffff;--text2:#c8c7d4;--text3:#8887a0;
  --accent:#c8f060;--accent2:#8b5cf6;--accent3:#f97316;
  --border:rgba(255,255,255,0.12);--border2:rgba(255,255,255,0.22);
  --radius:6px;--radius-lg:10px;--radius-xl:16px;
  --font-head:'Syne',sans-serif;--font-body:'DM Mono',monospace;
}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:13px;line-height:1.6;min-height:100vh;}
::selection{background:var(--accent);color:#0e0e10;}
input,textarea,select{font-family:var(--font-body);}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:4px;}

.app{max-width:800px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.app-header{padding:1.5rem 1.5rem 0;display:flex;align-items:flex-start;justify-content:space-between;}
.app-logo{font-family:var(--font-head);font-size:28px;font-weight:800;letter-spacing:-0.03em;line-height:1;}
.app-logo span{color:var(--accent);}
.app-sub{font-size:11px;color:var(--text3);margin-top:4px;letter-spacing:0.05em;text-transform:uppercase;}
.local-pill{font-size:10px;background:rgba(200,240,96,0.12);color:var(--accent);padding:3px 10px;border-radius:20px;border:1px solid rgba(200,240,96,0.2);letter-spacing:0.05em;text-transform:uppercase;}
/* who-bar removed */
.song-who-bar{display:flex;gap:6px;padding:10px 18px;flex-wrap:wrap;align-items:center;background:var(--bg4);border-bottom:1px solid var(--border);}
.song-who-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-right:4px;}
.song-who-btn{font-family:var(--font-body);font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;}
.song-who-btn:hover{border-color:var(--text3);color:var(--text);}
.song-who-btn.active{background:var(--accent);color:#0e0e10;border-color:var(--accent);font-weight:500;}
.main-nav{display:flex;padding:1.25rem 1.5rem 0;border-bottom:1px solid var(--border);margin-top:1rem;}
.nav-tab{font-family:var(--font-head);font-size:13px;font-weight:600;padding:8px 0;margin-right:28px;cursor:pointer;border:none;background:none;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;}
.nav-tab:hover{color:var(--text);}
.nav-tab.active{color:var(--text);border-bottom-color:var(--accent);}
.main{padding:1.25rem 1.5rem 5rem;flex:1;}
.section{display:none;}.section.active{display:block;}

/* SONG CARD */
.song-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-xl);margin-bottom:10px;overflow:hidden;transition:border-color .15s;}
.song-card:hover{border-color:var(--border2);}
.song-card-header{display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer;user-select:none;}
.song-number{font-size:10px;color:var(--text3);min-width:20px;text-align:right;}
.song-title{font-family:var(--font-head);font-size:16px;font-weight:700;flex:1;letter-spacing:-0.01em;}
.song-badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.badge{font-size:10px;padding:2px 8px;border-radius:4px;font-family:var(--font-body);}
.badge-key{background:rgba(139,92,246,0.2);color:#c4b5fd;border:1px solid rgba(139,92,246,0.3);}
.badge-bpm{background:var(--bg4);color:var(--text3);border:1px solid var(--border);}
.badge-ok{background:rgba(200,240,96,0.15);color:var(--accent);border:1px solid rgba(200,240,96,0.25);}
.badge-wip{background:rgba(249,115,22,0.15);color:#fdba74;border:1px solid rgba(249,115,22,0.25);}
.song-chevron{color:var(--text3);font-size:10px;transition:transform .2s;}
.song-chevron.open{transform:rotate(180deg);}
.song-body{display:none;border-top:1px solid var(--border);}
.song-body.open{display:block;}
.song-tabs{display:flex;padding:0 18px;border-bottom:1px solid var(--border);background:var(--bg3);overflow-x:auto;gap:0;}
.song-tab{font-size:11px;font-weight:500;padding:9px 14px;cursor:pointer;border:none;background:none;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:all .15s;font-family:var(--font-body);}
.song-tab:hover{color:var(--text);}
.song-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.song-tab-content{padding:18px;}
.stab-panel{display:none;}.stab-panel.active{display:block;}

/* INPUTS */
input,textarea,select{width:100%;font-size:12px;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg3);color:var(--text);transition:border-color .15s;}
textarea{resize:vertical;min-height:52px;}
input:focus,textarea:focus,select:focus{outline:none;border-color:rgba(200,240,96,0.4);background:var(--bg4);}
input::placeholder,textarea::placeholder{color:var(--text2);}
select option{background:var(--bg3);}

/* BUTTONS */
.btn-primary{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:8px 18px;border:none;border-radius:var(--radius);background:var(--accent);color:#0e0e10;cursor:pointer;font-family:var(--font-body);font-weight:500;transition:all .15s;}
.btn-primary:hover{background:#d4f570;transform:translateY(-1px);}
.btn-primary.sm{font-size:11px;padding:5px 12px;}
.btn-ghost{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:7px 14px;border:1px solid var(--border2);border-radius:var(--radius);background:transparent;color:var(--text2);cursor:pointer;font-family:var(--font-body);transition:all .15s;margin-top:8px;}
.btn-ghost:hover{background:var(--bg4);color:var(--text);}
.btn-ghost.sm{font-size:11px;padding:4px 10px;margin-top:0;}
.btn-ghost.danger{color:#f87171;border-color:rgba(248,113,113,0.3);}
.btn-ghost.danger:hover{background:rgba(248,113,113,0.1);}
.row-gap{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid21{display:grid;grid-template-columns:1fr 80px;gap:8px;}
.grid3{display:grid;grid-template-columns:1fr 100px 80px;gap:8px;}
.field-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:5px;}
.form-field{display:flex;flex-direction:column;gap:4px;}
.sub-form{background:var(--bg3);border-radius:var(--radius-lg);padding:14px;margin:8px 0;border:1px solid var(--border);display:grid;gap:10px;}
.hint{font-size:11px;color:var(--text2);line-height:1.5;}
.hint code{font-family:var(--font-body);background:var(--bg4);padding:1px 6px;border-radius:3px;color:var(--accent);}
.slabel{font-size:10px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:0.08em;margin:16px 0 8px;display:flex;align-items:center;gap:8px;}
.slabel::after{content:'';flex:1;height:1px;background:var(--border);}
.section-add-area{margin-top:16px;padding-top:16px;border-top:1px dashed var(--border);}
.empty{text-align:center;color:var(--text3);padding:3rem 1rem;font-size:13px;}
.empty-icon{font-size:32px;margin-bottom:12px;opacity:.4;}

/* CIFRADO */
.cifrado-wrap{font-family:var(--font-body);font-size:14px;line-height:3.2;background:var(--bg3);border-radius:var(--radius-lg);padding:16px;min-height:60px;border:1px solid var(--border);}
.cifrado-empty{font-size:11px;color:var(--text3);}
.cifrado-line{display:flex;flex-wrap:wrap;align-items:baseline;margin-bottom:4px;}
.cword{position:relative;display:inline-block;margin-right:7px;}
.cchord{position:absolute;top:-20px;left:0;font-size:11px;font-weight:500;color:var(--accent);white-space:nowrap;}

/* INLINE CHORD EDITOR */
.lyric-editor-area{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;}
.lyric-editor-toolbar{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg4);flex-wrap:wrap;}
.lyric-editor-toolbar span{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;}
.chord-group{display:flex;flex-direction:column;gap:4px;}
.chord-group-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;}
.chord-group-btns{display:flex;flex-wrap:wrap;gap:4px;}
.lyric-hint{font-size:11px;color:var(--text3);padding:6px 14px;background:var(--bg4);border-bottom:1px solid var(--border);}
.chord-pill-insert{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid rgba(200,240,96,0.3);background:rgba(200,240,96,0.08);color:var(--accent);cursor:pointer;font-family:var(--font-body);transition:all .15s;}
.chord-pill-insert:hover{background:rgba(200,240,96,0.18);}
.chord-input-add{width:80px;font-size:11px;padding:4px 8px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg3);color:var(--text);}
.lyric-editor-main{display:grid;grid-template-columns:1fr 1fr;min-height:180px;}
.lyric-raw{width:100%;min-height:180px;border:none;border-right:1px solid var(--border);border-radius:0;background:transparent;color:var(--text);font-size:13px;padding:14px;resize:none;font-family:var(--font-body);line-height:2.8;}
.lyric-raw:focus{outline:none;background:rgba(200,240,96,0.02);}
.lyric-preview-pane{padding:14px;overflow-y:auto;}
.lyric-preview-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;}

/* BLOQUE */
.bloque{margin-bottom:20px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;}
.bloque-header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg4);border-bottom:1px solid var(--border);}
.bloque-name{font-family:var(--font-head);font-size:12px;font-weight:700;color:var(--text);letter-spacing:.02em;}
.bloque-rep{font-size:10px;color:var(--text3);}
.bloque-actions{display:flex;gap:4px;margin-left:auto;}
.bloque-body{padding:14px;}

/* ACORDES */
.acordes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;}
.acorde-chip{background:var(--bg4);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:12px 8px;text-align:center;}
.acorde-chip .chord-name{font-family:var(--font-head);font-size:20px;font-weight:800;color:var(--accent);letter-spacing:-0.02em;}
.acorde-chip .chord-ctx{font-size:10px;color:var(--text3);margin-top:3px;}

/* PEDALES */
.pedal-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-bottom:12px;}
.pedal-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius);border:1px solid var(--border);cursor:pointer;transition:all .15s;user-select:none;}
.pedal-item:hover{border-color:rgba(139,92,246,0.4);background:rgba(139,92,246,0.05);}
.pedal-item.on{background:rgba(139,92,246,0.15);border-color:rgba(139,92,246,0.4);}
.pedal-check{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;transition:all .15s;}
.pedal-item.on .pedal-check{background:var(--accent2);border-color:var(--accent2);color:#fff;}
.pedal-label{font-size:12px;color:var(--text);}
.pedal-item.on .pedal-label{color:var(--text);}
.pedal-notas{margin-top:10px;}

/* BKIT */
.capsula-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
.capsula-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 14px;border-radius:var(--radius-lg);border:1px solid var(--border2);cursor:pointer;transition:all .15s;min-width:72px;background:var(--bg4);}
.capsula-item:hover{border-color:rgba(200,240,96,0.35);background:rgba(200,240,96,0.05);}
.capsula-item.on{background:rgba(200,240,96,0.15);border-color:rgba(200,240,96,0.5);}
.capsula-item.on span{color:var(--accent);}
.capsula-icon{font-size:18px;line-height:1;color:var(--text3);}
.capsula-item.on .capsula-icon{color:var(--accent);}
.capsula-item span{font-size:10px;color:var(--text2);white-space:nowrap;}
.bkit-item{background:var(--bg4);border-radius:var(--radius-lg);padding:10px;border:1px solid var(--border);}
.bkit-label{font-size:10px;color:#ffb380;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;font-weight:500;}
.bkit-item textarea{min-height:40px;font-size:11px;background:var(--bg3);}

/* MEMBER */
.member-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:8px;}
.member-box-title{font-size:12px;font-weight:500;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.member-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dot-gv{background:#8b5cf6;}.dot-g1{background:#f97316;}.dot-bat{background:#ef4444;}.dot-bas{background:#06b6d4;}

/* SCALE GUIDE */
.scale-guide-box{background:var(--bg4);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px;margin-bottom:4px;}
.sg-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.sg-section-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;}
.sg-estilo-btns{display:flex;gap:5px;flex-wrap:wrap;}
.sg-btn-estilo{font-family:var(--font-body);font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;}
.sg-btn-estilo:hover{border-color:var(--text3);color:var(--text);}
.sg-btn-estilo.active{background:var(--accent);color:#0e0e10;border-color:var(--accent);font-weight:500;}
.sg-acorde-select{font-family:var(--font-body);font-size:13px;font-weight:600;padding:5px 10px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg3);color:var(--accent);width:auto;}
.sg-scales-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px;}
.sg-scale-card{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:10px;}
.sg-scale-name{font-family:var(--font-head);font-size:12px;font-weight:700;color:var(--text);margin-bottom:2px;}
.sg-scale-notas{font-size:10px;color:var(--accent);margin-bottom:8px;font-family:var(--font-body);}
.sg-fretboard{display:flex;flex-direction:column;gap:2px;}
.sg-string-row{display:flex;align-items:center;gap:3px;}
.sg-string-label{font-size:11px;font-weight:600;color:var(--accent);width:14px;text-align:center;flex-shrink:0;}
.sg-dot{width:20px;height:20px;border-radius:50%;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;background:var(--bg4);}
.sg-dot.on{background:var(--accent2);border-color:var(--accent2);color:#fff;font-size:8px;}
@media(max-width:520px){.sg-scales-wrap{grid-template-columns:1fr 1fr;}}
.tab-section{background:var(--bg4);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px;margin-bottom:12px;}
.tab-section-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.tab-name-input{flex:1;font-size:13px;font-weight:500;background:transparent;border:none;border-bottom:1px solid var(--border2);border-radius:0;padding:3px 0;color:var(--text);font-family:var(--font-head);}
.tab-name-input:focus{outline:none;border-bottom-color:var(--accent);}
.tab-textarea{width:100%;min-height:160px;font-family:var(--font-body);font-size:13px;line-height:1.8;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);padding:12px;resize:vertical;white-space:pre;overflow-x:auto;tab-size:1;}
.tab-textarea:focus{outline:none;border-color:rgba(200,240,96,0.4);background:var(--bg4);}
.tab-textarea::placeholder{color:var(--text3);font-size:11px;line-height:1.6;}

/* SESIONES */
.sesion-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-xl);padding:16px 18px;margin-bottom:10px;}
.sesion-date{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.sesion-title{font-family:var(--font-head);font-size:15px;font-weight:700;margin-bottom:8px;}
.sesion-notas{font-size:12px;color:var(--text);margin-bottom:10px;}
.links-row{display:flex;flex-wrap:wrap;gap:6px;}
.link-btn{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--accent);text-decoration:none;padding:6px 12px;border:1px solid rgba(200,240,96,0.25);border-radius:var(--radius);background:rgba(200,240,96,0.05);transition:all .15s;}
.link-btn:hover{background:rgba(200,240,96,0.12);}

/* PENDIENTES */
.pend-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-xl);padding:4px 18px;margin-bottom:10px;}
.pend-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.pend-item:last-child{border-bottom:none;}
.check-box{width:18px;height:18px;border:1.5px solid var(--border2);border-radius:4px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:2px;font-size:10px;color:var(--accent);transition:all .15s;}
.check-box.done{background:rgba(200,240,96,0.15);border-color:rgba(200,240,96,0.4);}
.pend-texto{font-size:13px;}.pend-texto.done{text-decoration:line-through;color:var(--text3);}
.pend-quien{font-size:11px;color:var(--text3);margin-top:3px;}

/* ── TELEPROMPTER ── */
.tp-overlay{display:none;position:fixed;inset:0;background:#0a0a0a;z-index:1000;flex-direction:column;}
.tp-overlay.active{display:flex;}
.tp-header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0;gap:12px;}
.tp-song-name{font-family:var(--font-head);font-size:16px;font-weight:700;color:#fff;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tp-controls{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.tp-speed-label{font-size:11px;color:rgba(255,255,255,.4);}
.tp-speed{width:80px;}
.tp-btn{font-family:var(--font-body);font-size:12px;padding:7px 14px;border-radius:var(--radius);border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;cursor:pointer;transition:all .15s;white-space:nowrap;}
.tp-btn:hover{background:rgba(255,255,255,.1);}
.tp-btn.play{background:var(--accent);color:#000;border-color:var(--accent);font-weight:500;}
.tp-btn.play:hover{background:#d4f570;}
.tp-close{font-size:20px;background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;padding:4px 8px;line-height:1;}
.tp-close:hover{color:#fff;}
.tp-stage{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:40px 8% 60vh;}
.tp-bloque-name{font-family:var(--font-head);font-size:13px;font-weight:700;color:rgba(200,240,96,.7);text-transform:uppercase;letter-spacing:.12em;margin-bottom:20px;margin-top:48px;padding:6px 14px;border-left:3px solid rgba(200,240,96,.5);}
.tp-bloque-name:first-child{margin-top:0;}
.tp-line{display:flex;flex-wrap:wrap;align-items:flex-end;margin-bottom:40px;row-gap:40px;}
.tp-word{display:inline-flex;flex-direction:column;align-items:flex-start;margin-right:14px;}
.tp-chord{font-family:var(--font-head);font-size:22px;font-weight:800;color:var(--accent);white-space:nowrap;letter-spacing:-0.01em;line-height:1;margin-bottom:8px;text-shadow:0 0 20px rgba(200,240,96,0.35);}
.tp-chord-empty{display:block;height:30px;margin-bottom:8px;}
.tp-syllable{font-size:34px;color:#ffffff;line-height:1;font-family:var(--font-head);font-weight:500;letter-spacing:-0.01em;}
.tp-progress{position:fixed;bottom:0;left:0;height:3px;background:var(--accent);pointer-events:none;}

// ── CIFRADO RENDER ──
function renderCifradoHtml(raw){
  if(!raw||!raw.trim())return'<span class="cifrado-empty">Sin cifrado. Usa el editor de abajo.</span>';
  return raw.split('\n').map(line=>{
    if(!line.trim())return'<div style="height:6px;"></div>';
    return'<div class="cifrado-line">'+line.split(' ').map(w=>{
      const p=w.split('|');
      if(p.length>=2)return`<span class="cword"><span class="cchord">${esc(p[0])}</span>${esc(p.slice(1).join('|'))} </span>`;
      return`<span class="cword">${esc(w)} </span>`;
    }).join('')+'</div>';
  }).join('');
}

function extractChords(bloques){
  const found=new Set();const ctx={};
  (bloques||[]).forEach(b=>{
    (b.cifrado||'').split('\n').forEach(line=>{
      line.split(' ').forEach(w=>{
        const p=w.split('|');
        if(p.length>=2&&p[0].trim()){const ch=p[0].trim();found.add(ch);if(!ctx[ch])ctx[ch]=[];if(!ctx[ch].includes(b.nombre))ctx[ch].push(b.nombre);}
      });
    });
  });
  return{chords:[...found],ctx};
}

function insertChord(textareaId, chord){
  if(!chord)return;
  const ta=document.getElementById(textareaId);
  if(!ta)return;
  const pos=ta.selectionStart;
  const val=ta.value;

  // Find the full word at cursor position
  let wordStart=pos;
  let wordEnd=pos;
  while(wordStart>0&&val[wordStart-1]!==' '&&val[wordStart-1]!=='\n')wordStart--;
  while(wordEnd<val.length&&val[wordEnd]!==' '&&val[wordEnd]!=='\n')wordEnd++;
  const word=val.substring(wordStart,wordEnd);

  if(!word.trim()){
    // Cursor on whitespace — insert marker at cursor
    const ins=chord+'| ';
    ta.value=val.substring(0,pos)+ins+val.substring(pos);
    ta.selectionStart=ta.selectionEnd=pos+ins.length;
  } else {
    // Strip existing chord from word if any
    const clean=word.replace(/^[^|]+\|/,'');
    const newWord=chord+'|'+clean;
    ta.value=val.substring(0,wordStart)+newWord+val.substring(wordEnd);
    ta.selectionStart=ta.selectionEnd=wordStart+newWord.length;
  }
  ta.focus();
  const parts=textareaId.split('-');
  updateLyricPreview(parseInt(parts[2]),parseInt(parts[3]));
}

let scaleGuideState={};

function buildScaleGuide(ci){
  const state=scaleGuideState[ci]||{estilo:'Rock',acorde:'Am'};
  const estiloBtns=ESTILOS.map(e=>`<button class="sg-btn-estilo${state.estilo===e?' active':''}" onclick="setSGEstilo(${ci},'${e}')">${e}</button>`).join('');
  const acordeSelect=`<select class="sg-acorde-select" onchange="setSGAcorde(${ci},this.value)">
    ${ACORDES_LISTA.map(a=>`<option value="${a}"${state.acorde===a?' selected':''}>${a}</option>`).join('')}
  </select>`;
  const escalas=SCALE_DB[state.estilo]||[];
  const escalaCards=escalas.map(s=>`
    <div class="sg-scale-card">
      <div class="sg-scale-name">${s.nombre}</div>
      <div class="sg-scale-notas">${s.notas}</div>
      <div class="sg-fretboard">
        ${s.patron.map(([cuerda,...dots])=>`
          <div class="sg-string-row">
            <div class="sg-string-label">${cuerda}</div>
            ${dots.map(d=>`<div class="sg-dot${d==='●'?' on':''}">${d==='●'?'●':''}</div>`).join('')}
          </div>`).join('')}
      </div>
    </div>`).join('');
  return`<div>
    <div class="sg-row">
      <div class="sg-section-label">Estilo</div>
      <div class="sg-estilo-btns">${estiloBtns}</div>
    </div>
    <div class="sg-row" style="margin-top:8px;">
      <div class="sg-section-label">Acorde base</div>
      ${acordeSelect}
    </div>
    <div class="sg-scales-wrap">${escalaCards}</div>
  </div>`;
}

function setSGEstilo(ci,estilo){
  if(!scaleGuideState[ci])scaleGuideState[ci]={estilo:'Rock',acorde:'Am'};
  scaleGuideState[ci].estilo=estilo;
  const box=document.getElementById('scale-guide-'+ci);
  if(box)box.innerHTML=buildScaleGuide(ci);
}
function setSGAcorde(ci,acorde){
  if(!scaleGuideState[ci])scaleGuideState[ci]={estilo:'Rock',acorde:'Am'};
  scaleGuideState[ci].acorde=acorde;
  const box=document.getElementById('scale-guide-'+ci);
  if(box)box.innerHTML=buildScaleGuide(ci);
}

function buildTabEditor(c,ci){
  const tabs=c.tabs||[];
  let tabsHtml='';
  if(!tabs.length){
    tabsHtml='<div style="font-size:12px;color:var(--text2);margin-bottom:8px;">Sin tablaturas. Agrega una abajo.</div>';
  }
  tabs.forEach((t,ti)=>{
    tabsHtml+=`<div class="tab-section" id="tab-section-${ci}-${ti}">
      <div class="tab-section-header">
        <input class="tab-name-input" id="tab-name-${ci}-${ti}" value="${esc(t.nombre||'')}" placeholder="Nombre (ej: Solo intro, Lick coro...)">
        <button class="btn-ghost sm danger" onclick="deleteTab(${ci},${ti})">✕</button>
      </div>
      <textarea
        id="tab-text-${ci}-${ti}"
        class="tab-textarea"
        placeholder="e|--0--2--3--2--0----|\nB|--1--3--3--3--1----|\nG|--0--2--4--2--0----|\nD|--2--0--5--0--2----|\nA|--3-----5-----3----|\nE|--------3----------|"
        spellcheck="false"
      >${esc(t.texto||'')}</textarea>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
        <button class="btn-primary sm" onclick="saveTab(${ci},${ti})">💾 Guardar</button>
        <span class="tab-saved-msg" id="tab-saved-${ci}-${ti}" style="font-size:11px;color:var(--accent);align-self:center;display:none;">✓ Guardado</span>
      </div>
      <div class="slabel">Notas del lick</div>
      <textarea id="tab-nota-${ci}-${ti}" placeholder="Técnica, digitación, referencia..." style="min-height:36px;font-size:12px;">${esc(t.nota||'')}</textarea>
    </div>`;
  });
  return`<div>
    ${tabsHtml}
    <button class="btn-ghost" onclick="addTab(${ci})">+ Agregar tablatura</button>
  </div>`;
}

async function saveTab(ci,ti){
  if(!db.canciones[ci].tabs||!db.canciones[ci].tabs[ti])return;
  const t=db.canciones[ci].tabs[ti];
  const nameEl=document.getElementById('tab-name-'+ci+'-'+ti);
  if(nameEl)t.nombre=nameEl.value.trim();
  const textEl=document.getElementById('tab-text-'+ci+'-'+ti);
  if(textEl)t.texto=textEl.value;
  const notaEl=document.getElementById('tab-nota-'+ci+'-'+ti);
  if(notaEl)t.nota=notaEl.value.trim();
  await supa.from('canciones').update({tabs:db.canciones[ci].tabs}).eq('id',db.canciones[ci].id);
  const msg=document.getElementById('tab-saved-'+ci+'-'+ti);
  if(msg){msg.style.display='inline';setTimeout(()=>msg.style.display='none',2000);}
}

async function addTab(ci){
  if(!db.canciones[ci].tabs)db.canciones[ci].tabs=[];
  db.canciones[ci].tabs.push({nombre:'',texto:'',nota:''});
  await supa.from('canciones').update({tabs:db.canciones[ci].tabs}).eq('id',db.canciones[ci].id);
  renderCanciones();reopenSong(ci,currentWho==='Guit 1era'?'mi-parte':'guit-1era');
}
async function deleteTab(ci,ti){
  if(!confirm('\u00bfEliminar esta tablatura?'))return;
  db.canciones[ci].tabs.splice(ti,1);
  await supa.from('canciones').update({tabs:db.canciones[ci].tabs}).eq('id',db.canciones[ci].id);
  renderCanciones();reopenSong(ci,currentWho==='Guit 1era'?'mi-parte':'guit-1era');
}

function buildPanelFor(c,ci,tabId,who){
  if(tabId==='cifrado') return buildCifradoPanel(c,ci);
  if(tabId==='acordes') return buildAcordesPanel(c);
  if(tabId==='mi-parte'){
    if(who==='Vocal Guit') return buildVocalPanel(c,ci);
    if(who==='Guit 1era') return buildGuitPanel(c,ci,'Guit 1era');
    if(who==='Batería') return buildBatPanel(c,ci);
    if(who==='Bass') return buildBassPanel(c,ci);
  }
  if(tabId==='vocal-guit') return buildVocalPanel(c,ci);
  if(tabId==='guit-1era') return buildGuitPanel(c,ci,'Guit 1era');
  if(tabId==='bateria') return buildBatPanel(c,ci);
  if(tabId==='bass') return buildBassPanel(c,ci);
  if(tabId==='general') return buildGeneralPanel(c,ci);
  return'';
}

function buildPanel(c,ci,tabId){
  return buildPanelFor(c,ci,tabId,songWho[ci]||'todos');
}

function renderCanciones(){
  const el=document.getElementById('tab-canciones');
  let html='';
  if(!db.canciones.length) html='<div class="empty"><div class="empty-icon">🎸</div>Sin canciones. ¡Agrega la primera!</div>';

  db.canciones.forEach((c,ci)=>{
    const who=songWho[ci]||'todos';
    const songTabs=getSongTabsFor(who);
    const whoSelectorHtml=MEMBERS_LIST.map(m=>{
      const key=`song-who-${ci}-${m.replace(/\s/g,'').replace('í','i').replace('é','e')}`;
      return`<button class="song-who-btn song-who-btn-${ci}${who===m?' active':''}" id="${key}" onclick="setSongWho(${ci},'${m}')">${MEMBERS_LABELS[m]}</button>`;
    }).join('');
    const tabsHtml=songTabs.map(t=>`<button class="song-tab stab-${ci}${t==='cifrado'?' active':''}" id="stab-${ci}-${t}" onclick="showSongTab(${ci},'${t}')">${TAB_LABELS[t]||t}</button>`).join('');
    const panelsHtml=songTabs.map(t=>`<div class="stab-panel stab-panel-${ci}${t==='cifrado'?' active':''}" id="spanel-${ci}-${t}">${buildPanel(c,ci,t)}</div>`).join('');
    html+=`<div class="song-card">
      <div class="song-card-header" onclick="toggleSong(${ci})">
        <div class="song-number">${ci+1}</div>
        <div class="song-title" ondblclick="event.stopPropagation();renameSong(${ci})" title="Doble clic para renombrar">${esc(c.titulo)}</div>
        <div class="song-badges">
          ${c.tono?`<span class="badge badge-key">${esc(c.tono)}</span>`:''}
          ${c.bpm?`<span class="badge badge-bpm">${c.bpm} BPM</span>`:''}
          <span class="badge ${c.lista?'badge-ok':'badge-wip'}">${c.lista?'Lista':'En progreso'}</span>
        </div>
        <div class="song-chevron" id="chev-${ci}">▼</div>
      </div>
      <div class="song-body" id="sbody-${ci}">
        <div class="song-who-bar">
          <span class="song-who-label">Soy:</span>
          ${whoSelectorHtml}
        </div>
        <div class="song-tabs" id="song-tabs-${ci}">${tabsHtml}</div>
        <div class="song-tab-content">
          <div id="song-panels-${ci}">${panelsHtml}</div>
        </div>
      </div>
    </div>`;
  });

  html+=`<div class="section-add-area">
    <button class="btn-ghost" onclick="toggleAddCancion()">+ Agregar canción</button>
    <div id="add-cancion-form" style="display:none;margin-top:12px;" class="sub-form">
      <div class="grid3">
        <div class="form-field"><div class="field-label">Título</div><input id="nc-titulo" placeholder="Nombre de la canción"></div>
        <div class="form-field"><div class="field-label">Tono</div><input id="nc-tono" placeholder="Am, C, G..."></div>
        <div class="form-field"><div class="field-label">BPM</div><input id="nc-bpm" type="number" placeholder="120"></div>
      </div>
      <div class="row-gap">
        <button class="btn-primary" onclick="saveCancion()">Guardar canción</button>
        <button class="btn-ghost sm" onclick="document.getElementById('add-cancion-form').style.display='none'">Cancelar</button>
      </div>
    </div>
  </div>`;
  el.innerHTML=html;
}

async function saveBloque(ci){

  const rep=document.getElementById('bl-r-'+ci).value.trim();
  const letra=document.getElementById('bl-letra-'+ci).value.trim();
  if(!db.canciones[ci].bloques)db.canciones[ci].bloques=[];
  db.canciones[ci].bloques.push({nombre,rep,cifrado:letra});
  await supa.from('canciones').update({bloques:db.canciones[ci].bloques}).eq('id',db.canciones[ci].id);
  renderCanciones();reopenSong(ci,'cifrado');
}
async function deleteBloque(ci,bi){
  db.canciones[ci].bloques.splice(bi,1);

  renderCanciones();reopenSong(ci,'cifrado');
}
async function togglePedal(ci,member,pedal){
  if(!db.canciones[ci].pedales)db.canciones[ci].pedales={};
  if(!db.canciones[ci].pedales[member])db.canciones[ci].pedales[member]=[];
  const arr=db.canciones[ci].pedales[member];
  const idx=arr.indexOf(pedal);
  if(idx>=0)arr.splice(idx,1);else arr.push(pedal);
  await supa.from('canciones').update({pedales:db.canciones[ci].pedales}).eq('id',db.canciones[ci].id);
  const tabId=currentWho==='todos'?(member==='Vocal Guit'?'vocal-guit':'guit-1era'):'mi-parte';
  renderCanciones();reopenSong(ci,tabId);
}

async function deleteCancion(ci){
  if(!confirm('¿Eliminar esta canción?'))return;
  await supa.from('canciones').delete().eq('id',db.canciones[ci].id);
  db.canciones.splice(ci,1);renderCanciones();
}
async function saveCancion(){
  const titulo=document.getElementById('nc-titulo').value.trim();if(!titulo)return;
  const nueva={titulo,tono:document.getElementById('nc-tono').value.trim(),bpm:document.getElementById('nc-bpm').value||null,lista:false,bloques:[],notas:{},pedales:{},bkit:{},nota_general:'',tabs:[]};
  const{data}=await supa.from('canciones').insert(nueva).select().single();
  if(data){db.canciones.push(data);renderCanciones();}
}
async function renameSong(ci){
  const nuevo=prompt('Nuevo nombre:',db.canciones[ci].titulo);
  if(!nuevo||!nuevo.trim()||nuevo.trim()===db.canciones[ci].titulo)return;
  db.canciones[ci].titulo=nuevo.trim();
  await supa.from('canciones').update({titulo:db.canciones[ci].titulo}).eq('id',db.canciones[ci].id);
  renderCanciones();
}
function reopenSong(ci,tab){
  const body=document.getElementById('sbody-'+ci);const chev=document.getElementById('chev-'+ci);
  if(body){body.classList.add('open');if(chev)chev.classList.add('open');}
  if(tab)showSongTab(ci,tab);
}

// ── TELEPROMPTER ──
let tpPlaying=false,tpAnim=null,tpSpeed=3,tpPos=0;

function openTP(ci){
  const c=db.canciones[ci];
  document.getElementById('tp-title').textContent=c.titulo+(c.tono?' — '+c.tono:'');
  const stage=document.getElementById('tp-stage');
  const content=document.getElementById('tp-content');
  let html='';
  (c.bloques||[]).forEach(b=>{
    html+=`<div class="tp-bloque-name">${b.nombre||''}${b.rep?' ×'+b.rep:''}</div>`;
    const raw=b.cifrado||'';
    if(!raw.trim()){html+='<div style="height:20px;"></div>';return;}
    raw.split('\n').forEach(line=>{
      if(!line.trim()){html+='<div style="height:20px;"></div>';return;}
      html+='<div class="tp-line">';
      line.split(' ').forEach(w=>{
        const p=w.split('|');
        if(p.length>=2){
          const chord=p[0];
          const syl=p.slice(1).join('|');
          html+=`<span class="tp-word"><span class="tp-chord">${chord}</span><span class="tp-syllable">${syl}</span></span>`;
        } else if(w.trim()){
          html+=`<span class="tp-word"><span class="tp-chord-empty"></span><span class="tp-syllable">${w}</span></span>`;
        }
      });
      html+='</div>';
    });
  });
  content.innerHTML=html;
  tpPos=0;
  stage.scrollTop=0;
  tpPlaying=false;
  document.getElementById('tp-playbtn').textContent='▶ Play';
  document.getElementById('tp-progress').style.width='0%';
  document.getElementById('tp-overlay').classList.add('active');
  document.body.style.overflow='hidden';
  // update progress on manual scroll
  stage.onscroll=()=>{
    const max=stage.scrollHeight-stage.clientHeight;
    if(max>0) document.getElementById('tp-progress').style.width=(stage.scrollTop/max*100)+'%';
  };
}

function closeTP(){
  document.getElementById('tp-overlay').classList.remove('active');
  document.body.style.overflow='';
  if(tpAnim)cancelAnimationFrame(tpAnim);
  tpPlaying=false;
}

function changeSpeed(delta){
  tpSpeed=Math.max(1,Math.min(20,tpSpeed+delta));
  const el=document.getElementById('tp-speed-val');
  if(el)el.textContent=tpSpeed;
}

function togglePlay(){
  tpPlaying=!tpPlaying;
  document.getElementById('tp-playbtn').textContent=tpPlaying?'⏸ Pausa':'▶ Play';
  if(tpPlaying)animateTP();
}

function resetTP(){
  tpPos=0;
  const stage=document.getElementById('tp-stage');
  stage.scrollTop=0;
  document.getElementById('tp-progress').style.width='0%';
  if(tpPlaying){tpPlaying=false;document.getElementById('tp-playbtn').textContent='▶ Play';}
  if(tpAnim)cancelAnimationFrame(tpAnim);
}

function animateTP(){
  if(!tpPlaying)return;
  const stage=document.getElementById('tp-stage');
  const max=stage.scrollHeight-stage.clientHeight;
  if(max<=0){tpPlaying=false;return;}
  const speed=tpSpeed||3;
  tpPos+=speed*0.25;
  if(tpPos>max)tpPos=max;
  stage.scrollTop=tpPos;
  document.getElementById('tp-progress').style.width=(tpPos/max*100)+'%';
  if(tpPos>=max){tpPlaying=false;document.getElementById('tp-playbtn').textContent='▶ Play';return;}
  tpAnim=requestAnimationFrame(animateTP);
}

// ── SESIONES ──
function renderSesiones(){
  const el=document.getElementById('tab-sesiones');
  const sorted=[...db.sesiones].sort((a,b)=>(b.fecha||'')>(a.fecha||'')?1:-1);
  let html='';
  if(!sorted.length)html='<div class="empty"><div class="empty-icon">🎙</div>Sin sesiones grabadas.</div>';
  sorted.forEach(s=>{
    const si=db.sesiones.indexOf(s);
    const links=[s.link1,s.link2,s.link3].filter(Boolean);
    html+=`<div class="sesion-card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
        <div style="flex:1;">
          <div class="sesion-date">📅 ${esc(s.fecha||'—')}</div>
          <div class="sesion-title">${esc(s.titulo)}</div>
          ${s.notas?`<div class="sesion-notas">${esc(s.notas)}</div>`:''}
          <div class="links-row">
            ${links.map((l,i)=>`<a class="link-btn" href="${esc(l)}" target="_blank" rel="noreferrer">▶ Grabación ${i+1}</a>`).join('')||'<span style="font-size:11px;color:var(--text3);">Sin links</span>'}
          </div>
        </div>
        <button class="btn-ghost sm danger" onclick="deleteSesion(${si})">🗑</button>
      </div>
    </div>`;
  });
  html+=`<div class="section-add-area">
    <button class="btn-ghost" onclick="toggleAddSesion()">+ Agregar sesión</button>
    <div id="add-sesion-form" style="display:none;margin-top:12px;" class="sub-form">
      <div class="grid2">
        <div class="form-field"><div class="field-label">Fecha</div><input id="ns-fecha" type="date"></div>
        <div class="form-field"><div class="field-label">Descripción</div><input id="ns-titulo" placeholder="Sala, demo, live..."></div>
      </div>
      <div class="form-field"><div class="field-label">Link grabación 1 (H4n / Drive / WhatsApp)</div><input id="ns-link1" placeholder="https://..."></div>
      <div class="form-field"><div class="field-label">Link grabación 2</div><input id="ns-link2" placeholder="https://... (opcional)"></div>
      <div class="form-field"><div class="field-label">Link grabación 3</div><input id="ns-link3" placeholder="https://... (opcional)"></div>
      <div class="form-field"><div class="field-label">Notas</div><input id="ns-notas" placeholder="Notas de la sesión"></div>
      <div class="row-gap">
        <button class="btn-primary" onclick="saveSesion()">Guardar sesión</button>
        <button class="btn-ghost sm" onclick="document.getElementById('add-sesion-form').style.display='none'">Cancelar</button>
      </div>
    </div>
  </div>`;
  el.innerHTML=html;
}
function toggleAddSesion(){const el=document.getElementById('add-sesion-form');el.style.display=el.style.display==='none'?'block':'none';if(el.style.display==='block')document.getElementById('ns-fecha').value=new Date().toISOString().split('T')[0];}
async function saveSesion(){
  const titulo=document.getElementById('ns-titulo').value.trim();if(!titulo)return;
  const nueva={fecha:document.getElementById('ns-fecha').value,titulo,link1:document.getElementById('ns-link1').value.trim(),link2:document.getElementById('ns-link2').value.trim(),link3:document.getElementById('ns-link3').value.trim(),notas:document.getElementById('ns-notas').value.trim()};
  const{data}=await supa.from('sesiones').insert(nueva).select().single();
  if(data){db.sesiones.unshift(data);renderSesiones();}
}
async function deleteSesion(si){if(!confirm('¿Eliminar?'))return;await supa.from('sesiones').delete().eq('id',db.sesiones[si].id);db.sesiones.splice(si,1);renderSesiones();}

// ── PENDIENTES ──
function renderPendientes(){
  const el=document.getElementById('tab-pendientes');
  let items='';
  if(!db.pendientes.length)items='<div class="empty" style="padding:2rem 0;"><div class="empty-icon">✅</div>¡Todo al día!</div>';
  db.pendientes.forEach((p,pi)=>{
    items+=`<div class="pend-item">
      <div class="check-box${p.done?' done':''}" onclick="togglePend(${pi})">${p.done?'✓':''}</div>
      <div style="flex:1;"><div class="pend-texto${p.done?' done':''}">${esc(p.texto)}</div>${p.quien?`<div class="pend-quien">👤 ${esc(p.quien)}</div>`:''}</div>
      <button class="btn-ghost sm danger" onclick="deletePend(${pi})">✕</button>
    </div>`;
  });
  el.innerHTML=`<div class="pend-card">${items}</div>
  <div class="section-add-area">
    <button class="btn-ghost" onclick="toggleAddPend()">+ Agregar pendiente</button>
    <div id="add-pend-form" style="display:none;margin-top:12px;" class="sub-form">
      <div class="form-field"><div class="field-label">Descripción</div><input id="np-texto" placeholder="¿Qué falta hacer?"></div>
      <div class="form-field"><div class="field-label">Asignado a</div>
        <select id="np-quien"><option value="">— Integrante —</option><option>Vocal Guit</option><option>Guit 1era</option><option>Batería</option><option>Bass</option><option>Todos</option></select>
      </div>
      <div class="row-gap">
        <button class="btn-primary" onclick="savePend()">Agregar</button>
        <button class="btn-ghost sm" onclick="document.getElementById('add-pend-form').style.display='none'">Cancelar</button>
      </div>
    </div>
  </div>`;
}
function toggleAddPend(){const el=document.getElementById('add-pend-form');el.style.display=el.style.display==='none'?'block':'none';}
async function togglePend(pi){
  db.pendientes[pi].done=!db.pendientes[pi].done;
  await supa.from('pendientes').update({done:db.pendientes[pi].done}).eq('id',db.pendientes[pi].id);
  renderPendientes();
}
async function deletePend(pi){
  await supa.from('pendientes').delete().eq('id',db.pendientes[pi].id);
  db.pendientes.splice(pi,1);renderPendientes();
}
async function savePend(){
  const texto=document.getElementById('np-texto').value.trim();if(!texto)return;
  const nuevo={texto,quien:document.getElementById('np-quien').value,done:false};
  const{data}=await supa.from('pendientes').insert(nuevo).select().single();
  if(data){db.pendientes.push(data);renderPendientes();}
}
